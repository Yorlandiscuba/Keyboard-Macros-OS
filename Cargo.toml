[package]
name = "keyboard-macros-os"
version = "0.1.0"
edition = "2021"
description = "Atajos globales que insertan texto. Windows primero."
license = "MIT"
publish = false

[[bin]]
name = "kmos"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
] }
tray-icon = { version = "0.26.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
