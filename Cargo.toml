[package]
name = "keyboard-macros-os"
version = "0.1.1"
edition = "2021"
description = "Atajos globales que insertan texto. Windows primero."
license = "MIT"
publish = false

[[bin]]
name = "kmos"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
] }
tray-icon = { version = "0.26.1", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
