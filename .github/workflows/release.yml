name: Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Probar
        run: cargo test --locked
      - name: Compilar
        run: cargo build --release --locked
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/kmos.exe dist/
          Copy-Item README.md, LICENSE, macros.example.json dist/
          Compress-Archive -Path dist/* -DestinationPath keyboard-macros-os-windows.zip -Force
      - name: Publicar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: keyboard-macros-os-windows.zip
